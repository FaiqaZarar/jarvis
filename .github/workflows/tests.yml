name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Windows first: it's the platform the full suite is proven on and the
    # one most testers use.
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # Qt widgets render without a display.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            jarvis/server/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ./jarvis/server

      - name: Run tests
        env:
          # The background service each test spawns keeps its files here,
          # not in the checkout.
          JARVIS_DAEMON_HOME: ${{ runner.temp }}\jarvis-home
        run: python -m pytest tests -q

  cloud-server:
    # The optional hosted server's own suite runs against a real, throwaway
    # Postgres (jarvis_cloud/tests/conftest.py).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: jarvis_cloud
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: jarvis_cloud_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: jarvis_cloud/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./jarvis_cloud[dev]"

      - name: Run tests
        working-directory: jarvis_cloud
        env:
          JARVIS_CLOUD_TEST_DATABASE_URL: postgresql://jarvis_cloud:ci-only@localhost:5432/jarvis_cloud_test
        run: python -m pytest tests -q
