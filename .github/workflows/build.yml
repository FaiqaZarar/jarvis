name: Build and release

# Builds the packaged desktop app for Windows, macOS and Linux and publishes
# them as a GitHub Release of this repo. Run it by hand from the Actions tab.
#
# Nothing secret is required. Optional repository secrets add features to
# the build; without them the build still succeeds and that feature is off:
#   GOOGLE_OAUTH_CLIENT_ID / GOOGLE_OAUTH_CLIENT_SECRET  shared Google Drive sign-in
#   POSTHOG_PROJECT_KEY / POSTHOG_HOST                   anonymous telemetry
#   CLOUD_BASE_URL                                       sign-in, feedback, error reports
# There is deliberately no shared embedding API key: a key baked into a public
# installer can be extracted by anyone, so each user adds their own on first run.
#
# macOS uses Homebrew's Python rather than actions/setup-python: python.org's
# macOS build has no sqlite3 enable_load_extension(), which sqlite-vec needs
# (see docs/mac-packaging-investigation.yml).

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, without the "v" (e.g. 0.1.0-preview)
        required: true
        default: 0.1.0-preview
      prerelease:
        description: Mark the release as a pre-release
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: build-and-release
  cancel-in-progress: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Refuse a version that's already released
        id: tag
        run: |
          set -e
          tag="v${VERSION}"
          if gh api "repos/${{ github.repository }}/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "::error::$tag already exists. Pick a new version."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}

  build-windows:
    needs: [check-version]
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ./jarvis/server
          pip install pyinstaller

      - name: Write embedded VERSION file
        # jarvis.modules.desktop_app.version reads this back at runtime.
        working-directory: packaging
        run: '[System.IO.File]::WriteAllText("VERSION", "${{ needs.check-version.outputs.tag }}")'

      - name: Bake in optional build settings
        # Passed via env so a secret's value can't change how the script parses.
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          POSTHOG_PROJECT_KEY: ${{ secrets.POSTHOG_PROJECT_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          CLOUD_BASE_URL: ${{ secrets.CLOUD_BASE_URL }}
        run: python packaging/write_bundled_settings.py

      - name: Build with PyInstaller
        working-directory: packaging
        run: pyinstaller --noconfirm jarvis_desktop.spec

      - name: Package a Windows installer
        # Inno Setup 6 ships preinstalled on windows-latest runners.
        working-directory: packaging
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=${{ inputs.version }} jarvis_installer.iss'

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-windows
          path: packaging/dist/JarvisSetup.exe
          if-no-files-found: error
          retention-days: 1

  build-linux:
    # Ubuntu 22.04 so the bundled binaries link against an older glibc and
    # the .deb installs on 22.04 and newer.
    needs: [check-version]
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ./jarvis/server
          pip install pyinstaller

      - name: Write embedded VERSION file
        working-directory: packaging
        run: echo -n "${{ needs.check-version.outputs.tag }}" > VERSION

      - name: Bake in optional build settings
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          POSTHOG_PROJECT_KEY: ${{ secrets.POSTHOG_PROJECT_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          CLOUD_BASE_URL: ${{ secrets.CLOUD_BASE_URL }}
        run: python3 packaging/write_bundled_settings.py

      - name: Build with PyInstaller
        working-directory: packaging
        run: pyinstaller --noconfirm jarvis_desktop_linux.spec

      - name: Check the built app starts
        working-directory: packaging
        run: bash smoke_test_daemon.sh dist/jarvis_desktop/jarvis_desktop

      - name: Package into a .deb
        working-directory: packaging
        run: bash package_deb.sh "${{ needs.check-version.outputs.tag }}"

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-linux
          path: packaging/dist/Jarvis.deb
          if-no-files-found: error
          retention-days: 1

  build-macos:
    needs: [check-version]
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Install Homebrew's Python 3.13
        run: |
          brew install python@3.13
          /opt/homebrew/opt/python@3.13/bin/python3.13 -m venv /tmp/build_venv

      - name: Install dependencies
        run: |
          /tmp/build_venv/bin/pip install --upgrade pip
          /tmp/build_venv/bin/pip install -r requirements.txt
          /tmp/build_venv/bin/pip install -e ./jarvis/server
          /tmp/build_venv/bin/pip install pyinstaller

      - name: Write embedded VERSION file
        working-directory: packaging
        run: echo -n "${{ needs.check-version.outputs.tag }}" > VERSION

      - name: Bake in optional build settings
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          POSTHOG_PROJECT_KEY: ${{ secrets.POSTHOG_PROJECT_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          CLOUD_BASE_URL: ${{ secrets.CLOUD_BASE_URL }}
        run: /tmp/build_venv/bin/python packaging/write_bundled_settings.py

      - name: Build with PyInstaller
        working-directory: packaging
        run: /tmp/build_venv/bin/pyinstaller --noconfirm jarvis_desktop_mac.spec

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Package Jarvis.app into a .dmg
        # Icon positions must match dmg_background.png's arrow
        # (see packaging/assets/src/README.md to regenerate it).
        working-directory: packaging
        run: |
          create-dmg \
            --volname "Jarvis" \
            --volicon "assets/icon.icns" \
            --background "assets/dmg_background.png" \
            --window-size 660 400 \
            --icon-size 128 \
            --icon "Jarvis.app" 180 170 \
            --hide-extension "Jarvis.app" \
            --app-drop-link 480 170 \
            --no-internet-enable \
            dist/Jarvis.dmg \
            dist/Jarvis.app

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-macos
          path: packaging/dist/Jarvis.dmg
          if-no-files-found: error
          retention-days: 1

  release:
    # Waits for all three builds; each is best-effort, so one platform
    # failing still releases the others. Fails only if none built.
    needs: [check-version, build-windows, build-linux, build-macos]
    if: always() && needs.check-version.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        run: |
          set -e
          ls -la dist
          files=$(ls dist/JarvisSetup.exe dist/Jarvis.dmg dist/Jarvis.deb 2>/dev/null || true)
          if [ -z "$files" ]; then
            echo "::error::No platform built successfully; nothing to release."
            exit 1
          fi
          flags=""
          if [ "$PRERELEASE" = "true" ]; then flags="--prerelease"; fi
          gh release create "$TAG" $files \
            --target "${{ github.sha }}" \
            --title "Jarvis $VERSION" \
            --notes-file packaging/release-notes.md \
            $flags
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check-version.outputs.tag }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
