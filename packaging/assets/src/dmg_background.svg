<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="800" viewBox="0 0 1320 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#f5f7fb"/>
      <stop offset="1" stop-color="#e9edf5"/>
    </linearGradient>
    <marker id="arrowhead" markerWidth="10" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <polygon points="0 0, 10 4.5, 0 9" fill="#8aa6d6"/>
    </marker>
  </defs>

  <rect width="1320" height="800" fill="url(#bg)"/>

  <!-- scattered graph/network decoration, top-left -->
  <g stroke="#c3d0e6" stroke-width="3" opacity="0.9">
    <line x1="90" y1="120" x2="160" y2="80"/>
    <line x1="160" y1="80" x2="230" y2="130"/>
    <line x1="160" y1="80" x2="150" y2="20"/>
  </g>
  <g fill="#9db4e0">
    <circle cx="90" cy="120" r="8"/>
    <circle cx="160" cy="80" r="11"/>
    <circle cx="230" cy="130" r="7"/>
    <circle cx="150" cy="20" r="6"/>
  </g>

  <!-- scattered doc/card decoration, bottom-left -->
  <g transform="translate(70,620) rotate(-12)">
    <rect width="86" height="108" rx="10" fill="#ffffff" stroke="#d7deec" stroke-width="3"/>
    <line x1="16" y1="30" x2="70" y2="30" stroke="#c3d0e6" stroke-width="5" stroke-linecap="round"/>
    <line x1="16" y1="52" x2="70" y2="52" stroke="#dbe3f0" stroke-width="5" stroke-linecap="round"/>
    <line x1="16" y1="74" x2="46" y2="74" stroke="#dbe3f0" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- search glass, top-right -->
  <g transform="translate(1195,90)" stroke="#a9bde3" stroke-width="7" fill="none" stroke-linecap="round">
    <circle cx="0" cy="0" r="26"/>
    <line x1="19" y1="19" x2="40" y2="40"/>
  </g>

  <!-- topic-hierarchy dots, bottom-right -->
  <g fill="#b7c8e8">
    <circle cx="1160" cy="640" r="9"/>
    <circle cx="1220" cy="670" r="13"/>
    <circle cx="1210" cy="610" r="6"/>
    <circle cx="1260" cy="720" r="7"/>
  </g>
  <g stroke="#c9d5ec" stroke-width="3">
    <line x1="1160" y1="640" x2="1220" y2="670"/>
    <line x1="1220" y1="670" x2="1210" y2="610"/>
    <line x1="1220" y1="670" x2="1260" y2="720"/>
  </g>

  <!-- connecting arrow between the two drop targets -->
  <path d="M 460 340 C 560 300, 620 300, 675 335" fill="none" stroke="#8aa6d6" stroke-width="6" stroke-linecap="round"/>
  <polygon points="690,340 663,323 668,344" fill="#8aa6d6"/>
</svg>
