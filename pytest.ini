[pytest]
# jarvis_server (jarvis/server/jarvis_server/) is a physically separate,
# independently-packageable distribution (jarvis/server/pyproject.toml) -
# not on sys.path by default the way jarvis/ itself is (this ini file's
# own directory). Editable-installing it (pip install -e ./jarvis/server)
# is the real, correct fix for actually running things; this line is a
# second, redundant-but-harmless belt-and-suspenders so the test suite
# still resolves it even without that install step.
pythonpath = jarvis/server
markers =
    live_api: makes a real, billed call to the embedding API - requires --run-live and EMBEDDING_API_KEY. Skipped by default.
    slow_cross_process: spawns real python subprocesses (cold numba/UMAP JIT cost, ~30s+ per invocation) - requires --run-slow. Skipped by default; run in CI/before release.
