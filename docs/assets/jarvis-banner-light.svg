<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Jarvis: your files and notes in one place, so Claude can use them">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f1f5ff"/>
      <stop offset="1" stop-color="#eef2fb"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.336" cy="0.5" r="0.42">
      <stop offset="0" stop-color="#3157D5" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#3157D5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.88" cy="0.15" r="0.4">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ringGlow">
      <stop offset="0" stop-color="#3157D5" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3157D5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b8def"/>
      <stop offset="1" stop-color="#3157D5"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3157D5" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#3157D5" stop-opacity="0.95"/>
    </linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#3157D5" fill-opacity="0.07"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
    <clipPath id="frame"><rect width="1280" height="400" rx="28"/></clipPath>
  </defs>

